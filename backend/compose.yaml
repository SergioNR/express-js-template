name: expressjs-template

networks:
  template-network:
    name: template-network
    driver: bridge

volumes:
  template-database:
    name: template-database

#* Local services only - the API itself runs on the host (`npm run start:local`).
#* The production image is built by CI from ./Dockerfile
services:
  database:
    image: postgres:18.6
    restart: on-failure
    container_name: server-postgresDB
    user: postgres
    volumes:
      - template-database:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:5432:5432 #* Only reachable from this machine, never from the LAN
    healthcheck:
      #* `docker compose up --wait database` returns once Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - template-network
