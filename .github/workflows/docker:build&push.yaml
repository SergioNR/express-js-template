name: Build Webapp Docker image and push to Docker Hub

on:
    push:
        branches: [ "latest", "next" ]

jobs:
    docker-build-and-push:
        runs-on: ubuntu-latest
        environment: ${{ github.ref_name }}
        steps:
        -
            name: Checkout
            uses: actions/checkout@v4
        -
            name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
                username: "${{ secrets.DOCKERHUB_USERNAME }}"
                password: "${{ secrets.DOCKERHUB_TOKEN }}"
        -
            name: Set up QEMU
            uses: docker/setup-qemu-action@v3
        -
            name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
        - 
            name: Set date
            id: date
            run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
        - 
            name: Generate Docker metadata
            id: meta
            uses: docker/metadata-action@v5
            with:
                images: ${{ secrets.DOCKERHUB_USERNAME }}/expressjs-template
                tags: |
                    type=raw,value=${{ github.ref_name }}
                    type=raw,value=${{ github.ref_name }}-${{ steps.date.outputs.date }}
        -
            name: Build and push
            uses: docker/build-push-action@v6
            with:
                context: ./backend
                platforms: linux/amd64 #,linux/arm64 - Not building for ARM, since ubuntu server is just amd64
                push: true
                tags: ${{ steps.meta.outputs.tags }}