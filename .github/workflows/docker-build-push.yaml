name: Build Docker images and push to Docker Hub

on:
  push:
    branches: [ "latest", "next" ]

# A newer push to the same branch supersedes an in-flight run - there is no
# point finishing (and pushing) an image for a commit that is no longer the tip
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Least privilege - the jobs only need to read the repository
permissions:
  contents: read

jobs:
  test:
    name: Test, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          # Separate lockfiles per package - both are cached
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - install
        working-directory: backend
        run: npm ci

      - name: Backend - test
        working-directory: backend
        run: npm test

      - name: Backend - lint
        working-directory: backend
        run: npx eslint .

      - name: Frontend - install
        working-directory: frontend
        run: npm ci

      - name: Frontend - lint
        working-directory: frontend
        run: npx eslint .

      # vite.config.js refuses to build without VITE_SITE_BASE_URL; this build
      # only proves the bundle compiles, so placeholder origins are enough
      - name: Frontend - build
        working-directory: frontend
        env:
          VITE_SITE_BASE_URL: https://ci.invalid
          VITE_API_BASE_URL: https://api.ci.invalid
        run: npm run build

  backend:
    name: Backend image
    needs: test
    runs-on: ubuntu-latest
    # Secrets/vars may be defined per GitHub environment (`latest` / `next`)
    # or at repository level - environment values take precedence
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/expressjs-template
          # The sha tag pins a deploy to an exact commit (rollbacks, audits)
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ github.ref_name }}-${{ steps.date.outputs.date }}
            type=sha,prefix=${{ github.ref_name }}-

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          platforms: linux/amd64 # amd64 only - the target server is amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  frontend:
    name: Frontend image
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/expressjs-template-front
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ github.ref_name }}-${{ steps.date.outputs.date }}
            type=sha,prefix=${{ github.ref_name }}-

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Vite bakes these into the bundle - configure them as GitHub
          # Actions variables (not secrets: they ship to every browser)
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_SITE_BASE_URL=${{ vars.VITE_SITE_BASE_URL }}
            VITE_PUBLIC_POSTHOG_KEY=${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
