name: Build Docker images and push to Docker Hub

on:
  push:
    branches: [ "latest", "next" ]

# Least privilege - the jobs only need to read the repository
permissions:
  contents: read

jobs:
  backend:
    name: Backend image
    runs-on: ubuntu-latest
    # Secrets/vars may be defined per GitHub environment (`latest` / `next`)
    # or at repository level - environment values take precedence
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/expressjs-template
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ github.ref_name }}-${{ steps.date.outputs.date }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          platforms: linux/amd64 # amd64 only - the target server is amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  frontend:
    name: Frontend image
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/expressjs-template-front
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ github.ref_name }}-${{ steps.date.outputs.date }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Vite bakes these into the bundle - configure them as GitHub
          # Actions variables (not secrets: they ship to every browser)
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_SITE_BASE_URL=${{ vars.VITE_SITE_BASE_URL }}
            VITE_PUBLIC_POSTHOG_KEY=${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
