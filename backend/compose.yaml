  database:
    image: postgres:18.6
    restart: on-failure
    container_name: server-postgresDB
    user: postgres
    volumes:
      - template-database:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    networks:
      - template-network
